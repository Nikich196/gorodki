name: Нужно решение Никиты
description: Вопрос по объёму, дизайну, срокам или аккаунтам, который решает Никита
labels: ["нужно-решение-Никиты"]
body:
  - type: textarea
    id: question
    attributes:
      label: Вопрос
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Варианты и рекомендация
      description: Плюсы и минусы каждого варианта, какой рекомендуем и почему.
    validations:
      required: true
  - type: input
    id: deadline
    attributes:
      label: Решить до
