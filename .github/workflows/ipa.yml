# IPA для установки на iPhone через Sideloadly (сборка Free, без Mac и без платного аккаунта).
# Запуск: вкладка Actions → ipa → Run workflow, или автоматически после изменений iOS-кода в main.
# Результат — во вкладке запуска, раздел Artifacts: два IPA (без подписи и с ad-hoc подписью).
# -skipPackagePluginValidation — ради плагина, генерирующего клиент API (см. ios.yml).
name: ipa

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ipa.yml"
  workflow_dispatch:

# Новый коммит в PR отменяет прогон прежнего (у ipa запусков по PR нет, но правило — как у остальных). Вне PR у каждого
# прогона своя группа: прогон коммита в main не отменяется и не вытесняется следующим слиянием из очереди — Render
# выкатывает сервер, только если все проверки коммита зелёные (render.yaml, autoDeployTrigger: checksPass).
concurrency:
  group: ipa-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  XCODEGEN_VERSION: "2.46.0"

jobs:
  ipa:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Установка XcodeGen ${{ env.XCODEGEN_VERSION }}
        run: ios/scripts/install-xcodegen.sh "$XCODEGEN_VERSION" "$RUNNER_TEMP/xcodegen"

      - name: Генерация Gorodki.xcodeproj
        run: "$RUNNER_TEMP/xcodegen/bin/xcodegen generate --spec ios/project.yml"

      - name: Release-Free для iPhone (без подписи)
        run: |
          xcodebuild build \
            -project ios/Gorodki.xcodeproj -scheme "Gorodki Free" -configuration Release-Free \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO -quiet

      - name: Упаковка IPA
        run: ios/scripts/package-ipa.sh "$RUNNER_TEMP/dd/Build/Products/Release-Free-iphoneos/Gorodki.app" "$RUNNER_TEMP/ipa"

      - uses: actions/upload-artifact@v7
        with:
          name: gorodki-free-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 14
          if-no-files-found: error
