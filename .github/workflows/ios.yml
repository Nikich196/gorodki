# Сборка iOS-приложения на Mac в GitHub Actions (своего Mac пока нет).
#  ios-build        — Xcode 27 (раннер xcode-27, public preview): Debug для симулятора и Release для iPhone,
#                      затем дымовой запуск и тесты приложения на симуляторе;
#  ios-build-xcode26 — раз в неделю резервная сборка на Xcode 26 (раннер macos-26),
#                      чтобы не зависеть только от preview-раннера.
# Снимки экранов, UI-тесты и SF Symbols — в ios-snapshots.yml, слияние не держат.
# -skipPackagePluginValidation: клиент API (пакет GorodkiAPI) генерируется плагином при сборке, а xcodebuild
# из командной строки без этого флага требует вручную подтвердить доверие плагину (docs/adr/0004-openapi-swift.md).
name: ios

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # понедельник, 06:00 по Минску
  workflow_dispatch:

# Новый коммит в PR отменяет прогон прежнего. Вне PR у каждого прогона своя группа: прогон коммита в main не отменяется
# и не вытесняется следующим слиянием из очереди — Render выкатывает сервер, только если все проверки коммита
# зелёные (render.yaml, autoDeployTrigger: checksPass), а отменённая проверка зелёной не бывает.
concurrency:
  group: ios-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  XCODEGEN_VERSION: "2.46.0"

jobs:
  # Mac-раннер дорогой по времени, поэтому собираем только если менялся iOS-код.
  # Пропущенная задача GitHub считает успешной, так что обязательная проверка не зависает.
  changes:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ios:
              - 'ios/**'
              - '.github/workflows/ios.yml'

  ios-build:
    needs: changes
    # Сборка идёт, если менялся iOS-код, при запуске кнопкой (changes пропущена) и если changes не отработала: упала,
    # вышла по времени. Иначе сбой фильтра путей молча пропускал бы в main непроверенный iOS-код — пропущенную
    # ios-build GitHub считает пройденной. !cancelled(), а не always(): отменённый прогон (новый коммит в PR) не должен
    # занимать Mac-раннер сборкой. По расписанию ios-build не нужна — там резервная сборка ниже.
    if: >-
      ${{ !cancelled() && github.event_name != 'schedule' &&
      (needs.changes.result != 'success' || needs.changes.outputs.ios == 'true') }}
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Версия Xcode
        run: xcodebuild -version

      # Первым, до долгой сборки: версии внешних пакетов в project.yml — те же, что в Package.resolved пакетов.
      - name: Версии пакетов приложения (ios/scripts/check-spm-pins.py)
        run: python3 -B ios/scripts/check-spm-pins.py

      - name: Установка XcodeGen ${{ env.XCODEGEN_VERSION }}
        run: ios/scripts/install-xcodegen.sh "$XCODEGEN_VERSION" "$RUNNER_TEMP/xcodegen"

      - name: Генерация Gorodki.xcodeproj
        run: '"$RUNNER_TEMP/xcodegen/bin/xcodegen" generate --spec ios/project.yml'

      - name: Debug-Free для симулятора
        run: |
          xcodebuild build \
            -project ios/Gorodki.xcodeproj -scheme "Gorodki Free" -configuration Debug-Free \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO -quiet

      - name: Release-Free для iPhone (без подписи)
        run: |
          xcodebuild build \
            -project ios/Gorodki.xcodeproj -scheme "Gorodki Free" -configuration Release-Free \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO -quiet

      - name: Release-Paid для iPhone (без подписи)
        run: |
          xcodebuild build \
            -project ios/Gorodki.xcodeproj -scheme "Gorodki Paid" -configuration Release-Paid \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO -quiet

      # iPhone новейшей из установленных iOS (ios/scripts/boot-simulator.sh — общий со снимками экранов).
      # Сбой симулятора на preview-раннере красит ios-build, а с ним не слить PR и не выкатить сервер (Render,
      # checksPass). Начнёт сбоить — повтор после simctl shutdown и erase, но не continue-on-error: тот спрячет и
      # настоящее падение.
      - name: Симулятор iPhone
        id: simulator
        timeout-minutes: 10
        run: bash ios/scripts/boot-simulator.sh >> "$GITHUB_OUTPUT"

      # Дымовой запуск. Код приложения ещё ни разу не исполнялся (Mac нет, S2 впереди): ошибки запуска — Info.plist,
      # регистрация фоновых задач, ловушки изоляции Swift 6 — иначе впервые проявились бы на iPhone. Приложение —
      # из шага «Debug-Free для симулятора», без подписи, как все сборки здесь: без entitlements (App Group, Keychain)
      # оно тоже обязано запускаться. Шагомер и Live Activity симулятор не проверит — это S1/S2 на телефоне.
      # После переднего плана — фон (scenePhase .background, BackgroundSync.enterBackground): время на досылку
      # (beginBackgroundTask) и заявки BGTaskScheduler — свой путь со своими ловушками изоляции. Адреса сервера в сборке
      # нет, так что проход синхронизации и реальное время в фоне не участвуют, а системные вызовы — да.
      - name: Дымовой запуск на симуляторе
        timeout-minutes: 5
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          app="$RUNNER_TEMP/dd/Build/Products/Debug-Free-iphonesimulator/Gorodki.app"
          bundle_id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Info.plist")
          reports="$HOME/Library/Logs/DiagnosticReports"
          mkdir -p "$reports"
          touch "$RUNNER_TEMP/launch-mark"
          xcrun simctl install "$UDID" "$app"
          launched=$(xcrun simctl launch --stdout="$RUNNER_TEMP/app-stdout.log" --stderr="$RUNNER_TEMP/app-stderr.log" \
            "$UDID" "$bundle_id")
          pid=${launched##* }
          echo "Запущено: $launched"

          # Имя процесса — из заголовка отчёта .ips (первая строка — JSON): под «Gorodki*» попадает и расширение
          # GorodkiWidgets, а упасть могло и оно.
          process_of() {
            head -n 1 "$1" | python3 -c '
          import json, sys
          header = json.load(sys.stdin)
          print(header.get("app_name") or header.get("name") or "?")
          ' 2>/dev/null || echo "?"
          }

          # Подождать $2 секунд: процесс жив и новых отчётов о падении нет — дальше; иначе журнал, отчёты и ошибка.
          alive_after() {
            sleep "$2"
            crashes=$(find "$reports" -name "Gorodki*" -newer "$RUNNER_TEMP/launch-mark")
            if kill -0 "$pid" 2>/dev/null && [ -z "$crashes" ]; then
              echo "$1: приложение живо, отчётов о падении нет."
              return 0
            fi
            crashed=""
            for report in $crashes; do
              crashed="$crashed $(process_of "$report")"
            done
            echo "::error::$1: приложение упало или закрылось (pid $pid; отчёты о падении:${crashed:- нет})"
            cat "$RUNNER_TEMP/app-stdout.log" "$RUNNER_TEMP/app-stderr.log" || true
            for report in $crashes; do
              echo "── $report"
              head -n 120 "$report"
            done
            exit 1
          }

          alive_after "20 секунд на переднем плане" 20
          # Настройки выходят на передний план — «Городки» уходят в фон, как при переключении приложений.
          xcrun simctl launch "$UDID" com.apple.Preferences \
            || { echo "::error::Симулятор не открыл Настройки — сбой симулятора, а не приложения"; exit 1; }
          alive_after "10 секунд в фоне" 10
          xcrun simctl terminate "$UDID" "$bundle_id"
          xcrun simctl uninstall "$UDID" "$bundle_id"

      # Тесты склейки приложения с iOS (цель GorodkiTests, ios/AppTests) — внутри приложения на том же симуляторе.
      # Без -quiet: в журнале видно, какие тесты прошли. «TEST SUCCEEDED» xcodebuild пишет и при нуле тестов (тесты
      # не собрались в цель или не нашлись), поэтому итог сверяется по пакету результатов: тестов не меньше, чем @Test
      # в ios/AppTests, упавших нет. Сводка — `xcresulttool get test-results summary` (Xcode 16+), она всегда JSON.
      - name: Тесты приложения на симуляторе
        timeout-minutes: 20
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          results="$RUNNER_TEMP/app-tests.xcresult"
          xcodebuild test \
            -project ios/Gorodki.xcodeproj -scheme "Gorodki Free" -configuration Debug-Free \
            -destination "id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -resultBundlePath "$results" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
          xcrun xcresulttool get test-results summary --path "$results" > "$RUNNER_TEMP/app-tests-summary.json" \
            || { echo "::error::xcresulttool не выдал сводку тестов приложения"; exit 1; }
          declared=$({ grep -rhE '^[[:space:]]*@Test' ios/AppTests || true; } | wc -l | tr -d ' ')
          python3 - "$RUNNER_TEMP/app-tests-summary.json" "$declared" <<'PY'
          import json, sys
          try:
              summary = json.load(open(sys.argv[1]))
          except ValueError:
              print(open(sys.argv[1]).read())
              print("::error::Сводка тестов приложения — не JSON (вывод xcresulttool выше)")
              sys.exit(1)
          declared = int(sys.argv[2])
          total, failed = summary.get("totalTestCount"), summary.get("failedTests")
          print(f"Тестов приложения: всего {total}, прошли {summary.get('passedTests')}, упали {failed}, "
                f"пропущены {summary.get('skippedTests')}; @Test в ios/AppTests: {declared}")
          if isinstance(total, int) and isinstance(failed, int) and total >= declared and failed == 0:
              sys.exit(0)
          # Ключи сводки могли смениться с новым Xcode — вся сводка в журнал, чтобы было видно, что пришло.
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          print(f"::error::Тесты приложения: всего {total} при {declared} объявленных, упали {failed}")
          sys.exit(1)
          PY

  ios-build-xcode26:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Версия Xcode
        run: xcodebuild -version

      - name: Установка XcodeGen ${{ env.XCODEGEN_VERSION }}
        run: ios/scripts/install-xcodegen.sh "$XCODEGEN_VERSION" "$RUNNER_TEMP/xcodegen"

      - name: Генерация Gorodki.xcodeproj
        run: '"$RUNNER_TEMP/xcodegen/bin/xcodegen" generate --spec ios/project.yml'

      - name: Debug-Free для симулятора на Xcode 26
        run: |
          xcodebuild build \
            -project ios/Gorodki.xcodeproj -scheme "Gorodki Free" -configuration Debug-Free \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO -quiet
