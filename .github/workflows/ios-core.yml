# Игровое ядро GameCore на Linux (быстро и без Mac), проверка оформления Swift-кода и текстов по-русски.
name: ios-core

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Новый коммит в PR отменяет прогон прежнего. Вне PR у каждого прогона своя группа: прогон коммита в main не отменяется
# и не вытесняется следующим слиянием из очереди — Render выкатывает сервер, только если все проверки коммита
# зелёные (render.yaml, autoDeployTrigger: checksPass), а отменённая проверка зелёной не бывает.
concurrency:
  group: ios-core-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ios-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v7

      # Тексты для игрока — по-русски (PLAN.md §6.10): дроби не через String(format:) — он ставит точку («1.23 км»),
      # и полные русские формы множественного числа в каталогах строк. Каталог собирает только Xcode, поэтому здесь —
      # проверка исходников; сами формы проверяют тесты приложения на симуляторе (ios.yml). Сначала — тесты проверки.
      - name: Локализация (ios/scripts/check-localization.py)
        run: |
          command -v python3 >/dev/null || { apt-get update -qq && apt-get install -y -qq python3; }
          python3 -B -m unittest discover -s ios/scripts -p 'test_*.py'
          python3 -B ios/scripts/check-localization.py

      - name: Тесты GameCore
        run: swift test --package-path ios/Packages/GameCore

      - name: Оформление кода (swift-format)
        working-directory: ios
        run: swift format lint --strict --recursive --configuration .swift-format Packages App AppTests Widgets

      # После проверки оформления: в .build пакета лежат исходники зависимостей, их проверять не нужно.
      - name: Клиент API (GorodkiAPI) — генерация из contracts/openapi.v1.json и тесты
        run: swift test --package-path ios/Packages/GorodkiAPI

      - name: Офлайн-синхронизация (GorodkiSync) — запись забега и доставка по контракту
        run: swift test --package-path ios/Packages/GorodkiSync

      # GRDB на Linux собирается с системной SQLite, распаковка тайлов тумана — с системной zlib: нужны заголовки.
      - name: Заголовки SQLite (GRDB) и zlib (туман)
        run: apt-get update -qq && apt-get install -y -qq libsqlite3-dev zlib1g-dev

      - name: Сетевой слой (GorodkiNetwork) — вход, токены, реальное время, кэш тумана
        run: swift test --package-path ios/Packages/GorodkiNetwork

      - name: База приложения (GorodkiPersistence) — очередь синхронизации на GRDB
        run: swift test --package-path ios/Packages/GorodkiPersistence
