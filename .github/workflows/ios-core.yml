# Игровое ядро GameCore на Linux (быстро и без Mac) и проверка оформления Swift-кода.
name: ios-core

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-core-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v7

      - name: Тесты GameCore
        run: swift test --package-path ios/Packages/GameCore

      - name: Оформление кода (swift-format)
        working-directory: ios
        run: swift format lint --strict --recursive --configuration .swift-format Packages App Widgets

      # После проверки оформления: в .build пакета лежат исходники зависимостей, их проверять не нужно.
      - name: Клиент API (GorodkiAPI) — генерация из contracts/openapi.v1.json и тесты
        run: swift test --package-path ios/Packages/GorodkiAPI

      - name: Офлайн-синхронизация (GorodkiSync) — запись забега и доставка по контракту
        run: swift test --package-path ios/Packages/GorodkiSync

      - name: Сетевой слой (GorodkiNetwork) — токены входа и обновление при 401
        run: swift test --package-path ios/Packages/GorodkiNetwork
