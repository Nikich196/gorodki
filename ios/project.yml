# Описание Xcode-проекта для XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Сам Gorodki.xcodeproj в git не хранится: он генерируется командой
#   xcodegen generate --spec ios/project.yml
# Так проект можно править на Windows, а собирать на Mac или в GitHub Actions.

name: Gorodki

options:
  bundleIdPrefix: io.github.nikich196
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: ru
  createIntermediateGroups: true
  groupSortPosition: top

# Четыре конфигурации: Debug/Release × Free/Paid.
#  Free — бесплатный Apple ID (установка через Sideloadly, подпись на 7 дней).
#  Paid — платный аккаунт разработчика (TestFlight, push, вход через Apple, NFC).
configs:
  Debug-Free: debug
  Release-Free: release
  Debug-Paid: debug
  Release-Paid: release

configFiles:
  Debug-Free: Config/Free.xcconfig
  Release-Free: Config/Free.xcconfig
  Debug-Paid: Config/Paid.xcconfig
  Release-Paid: Config/Paid.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  GameCore:
    path: Packages/GameCore
  GorodkiKit:
    path: Packages/GorodkiKit
  # Клиент API генерируется плагином при сборке: xcodebuild из командной строки запускать
  # с -skipPackagePluginValidation (docs/adr/0004-openapi-swift.md).
  GorodkiAPI:
    path: Packages/GorodkiAPI
  GorodkiSync:
    path: Packages/GorodkiSync
  GorodkiNetwork:
    path: Packages/GorodkiNetwork
  GorodkiPersistence:
    path: Packages/GorodkiPersistence
  # Внешние зависимости пакетов выше — точными версиями из их Package.resolved. Пакеты просят диапазон («from:»),
  # а своего Package.resolved у сгенерированного проекта нет: без этих строк Xcode брал бы новейшие версии, и приложение
  # собиралось бы не с тем, что проверили тесты пакетов в ios-core. Цели на них не ссылаются — строки только сужают
  # выбор версий. Обновил Package.resolved пакета — обнови и версию здесь: расхождение ловит
  # ios/scripts/check-spm-pins.py (шаг ios-build). Адреса — как в Package.resolved.
  OpenAPIKit:
    url: https://github.com/mattpolzin/OpenAPIKit
    exactVersion: 6.4.0
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 7.11.1
  SignalRClient:
    url: https://github.com/dotnet/signalr-client-swift
    exactVersion: 1.0.0
  swift-algorithms:
    url: https://github.com/apple/swift-algorithms
    exactVersion: 1.2.1
  swift-argument-parser:
    url: https://github.com/apple/swift-argument-parser
    exactVersion: 1.8.2
  swift-collections:
    url: https://github.com/apple/swift-collections
    exactVersion: 1.7.0
  swift-http-types:
    url: https://github.com/apple/swift-http-types
    exactVersion: 1.8.0
  swift-numerics:
    url: https://github.com/apple/swift-numerics.git
    exactVersion: 1.1.1
  swift-openapi-generator:
    url: https://github.com/apple/swift-openapi-generator
    exactVersion: 1.13.1
  swift-openapi-runtime:
    url: https://github.com/apple/swift-openapi-runtime
    exactVersion: 1.12.1
  swift-openapi-urlsession:
    url: https://github.com/apple/swift-openapi-urlsession
    exactVersion: 1.3.1
  Yams:
    url: https://github.com/jpsim/Yams
    exactVersion: 6.2.2

targets:
  Gorodki:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - PrivacyInfo.xcprivacy
      # Манифест приватности (PLAN.md, §7.2) — в ресурсы бандла явно: без него App Store Connect не примет сборку.
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: GorodkiWidgets
      - package: GameCore
      - package: GorodkiKit
        product: DesignSystem
      - package: GorodkiKit
        product: Platform
      - package: GorodkiAPI
      - package: GorodkiSync
        product: Sync
      - package: GorodkiNetwork
        product: Networking
      - package: GorodkiNetwork
        product: Realtime
      - package: GorodkiPersistence
        product: Persistence
    settings:
      base:
        PRODUCT_NAME: Gorodki
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) $(GORODKI_SWIFT_FLAG)
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug-Free:
          CODE_SIGN_ENTITLEMENTS: App/Gorodki-Free.entitlements
        Release-Free:
          CODE_SIGN_ENTITLEMENTS: App/Gorodki-Free.entitlements
        Debug-Paid:
          CODE_SIGN_ENTITLEMENTS: App/Gorodki-Paid.entitlements
        Release-Paid:
          CODE_SIGN_ENTITLEMENTS: App/Gorodki-Paid.entitlements

  # Расширение: Live Activity (экран блокировки, Dynamic Island) и виджеты.
  # Приложение обязано работать и без него: на бесплатной подписи расширение может не запуститься.
  GorodkiWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - PrivacyInfo.xcprivacy
      # У расширения — свой манифест приватности.
      - path: Widgets/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: GorodkiKit
        product: DesignSystem
      - package: GorodkiKit
        product: Platform
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_NAME: GorodkiWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widgets
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) $(GORODKI_SWIFT_FLAG)
        INFOPLIST_FILE: Widgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Widgets/GorodkiWidgets.entitlements
        SKIP_INSTALL: YES

  # Тесты склейки приложения с iOS (RunController, AppDependencies, Info.plist). Идут внутри запущенного приложения
  # на симуляторе (`xcodebuild test`, ios.yml): TEST_HOST и BUNDLE_LOADER XcodeGen ставит сам по зависимости от
  # приложения. Логика без iOS — в пакетах, её тесты идут на Linux (ios-core).
  GorodkiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: Gorodki
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Gorodki Free:
    build:
      targets:
        Gorodki: all
    run:
      config: Debug-Free
    test:
      config: Debug-Free
      targets:
        - GorodkiTests
    profile:
      config: Release-Free
    analyze:
      config: Debug-Free
    archive:
      config: Release-Free

  Gorodki Paid:
    build:
      targets:
        Gorodki: all
    run:
      config: Debug-Paid
    test:
      config: Debug-Paid
      targets:
        - GorodkiTests
    profile:
      config: Release-Paid
    analyze:
      config: Debug-Paid
    archive:
      config: Release-Paid
